# SwiftLint Configuration for MeterBar
# https://github.com/realm/SwiftLint

# Paths to include.
# Every first-party Swift target that ships to a user is linted — the app, the
# widget extension, the CLI, the shared package, and the repo's helper scripts.
# Previously only `MeterBar` was, so four of the five went unchecked.
included:
  - MeterBar
  - MeterBarWidget
  - MeterBarCLI
  - Packages
  - scripts
# Not yet included: MeterBarTests (332 → 246 of the violations this widening
# surfaced live there, almost all mechanical). Landing them here would bury the
# production-code fixes in test churn, so they stay a separate pass.

# Paths to exclude.
# `**/.build` (not just `.build`) matters now that the SwiftPM targets are
# linted: MeterBarCLI and Packages each carry their own build directory full of
# vendored dependency checkouts, which are not ours to lint.
excluded:
  - Pods
  - DerivedData
  - Build
  - "**/.build"

# Rules configuration
disabled_rules:
  - trailing_comma # SwiftUI uses trailing commas often
  - identifier_name # Allow short names like 'id', 'vm'
  - type_body_length # SwiftUI views can be long
  - file_length # Allow longer files for complex views
  - function_body_length # Some SwiftUI body properties are long
  - large_tuple # Needed for some async patterns

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discarded_notification_center_observer
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

type_name:
  min_length: 2
  max_length: 50

nesting:
  type_level: 3
  function_level: 3

cyclomatic_complexity:
  warning: 15
  error: 25

function_parameter_count:
  warning: 6
  error: 10

# Custom rules
custom_rules:
  no_print_statements:
    name: "No Print Statements"
    regex: "\\bprint\\s*\\("
    # Scoped to the GUI targets. In a menu-bar app or a widget extension there is
    # no terminal attached, so `print` writes to a stream nobody reads and the
    # unified log is the only place a message survives. In `MeterBarCLI` and the
    # helper scripts stdout *is* the product — every line the user sees is a
    # `print` — so applying the rule there would invert its own rationale.
    excluded:
      - ".*/MeterBarCLI/.*"
      - ".*/scripts/.*"
    message: "Use os_log or Logger instead of print"
    severity: warning

reporter: "xcode"
