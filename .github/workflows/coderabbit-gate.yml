name: CodeRabbit gate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  coderabbit-gate:
    name: coderabbit-gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout evaluator
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test review evidence evaluator offline
        run: scripts/test-coderabbit-review.sh

      - name: Require completed CodeRabbit review on the exact head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/verify-coderabbit-review.py --live
